# Trading Bot Configuration
# ==========================
# Clean config — no nested duplicates.
# Edit values below; env vars override via .env file.

bot:
  mode: paper
  name: IBT Trading Bot
  version: 2.0.0

trading:
  mode: paper
  initial_balance: 10000
  currency: USDT
  base_currency: BTC
  max_open_positions: 5
  monitor_interval: 30

risk:
  max_position_btc: 0.05
  stop_loss_pct: 0.04
  take_profit_pct: 0.06
  capital_pct_per_trade: 0.0125
  max_total_exposure_pct: 0.3
  daily_loss_limit_pct: 0.05
  consecutive_loss_limit: 3
  position_multiplier: 1.0

execution:
  max_retries: 3
  retry_delay: 1.0
  slippage_tolerance_pct: 0.1

strategy:
  min_spread: 0.01
  enabled_strategies:
    - BollingerBandBreakout
    - MACDCrossover
    - RSIMeanReversion
    - MultiIndicatorConsensus
  hyperopt:
    enabled: false
    max_iterations: 100
    population: 20

indicators:
  timeframes:
    - 5m
    - 15m
    - 1h
    - 4h
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  atr_period: 14

sentiment:
  enabled: false
  sources:
    - twitter
    - newsapi
  update_interval: 300

orchestration:
  enabled: false
  max_strategies: 5
  rebalance_interval: 3600
  kelly_fraction: 0.5

alerts:
  enabled: true
  telegram:
    enabled: false
    bot_token: YOUR_BOT_TOKEN
    chat_id: YOUR_CHAT_ID
  discord:
    enabled: false
    webhook_url: YOUR_WEBHOOK_URL
  on_trade: true
  on_stop_loss: true
  on_daily_limit: true

autonomy:
  enabled: true
  paper_mode:
    auto_execute: true
    max_position_usd: 100
    require_confirmation: false
    max_daily_trades: 10
  live_mode:
    auto_execute: false
    max_position_usd: 10
    require_confirmation: true
    max_daily_trades: 3

logging:
  level: INFO
  file: /storage/0000-0000/Hermes/logs/trading_bot.log
  max_size_mb: 50
  backup_count: 5

database:
  path: /storage/0000-0000/Hermes/repos/trading-bot/trades.db
  backup_interval: 86400

api:
  enabled: true
  port: 10000
  host: 0.0.0.0
  jwt_secret: change-me-in-production
  rate_limit: 100
